# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build dotnet application and container image 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
    types: [checks_requested]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch: 

env:
    ref_name: ${{ github.ref_name }}

jobs:
  dotnet:
    uses: y-function/workflows/.github/workflows/dotnet-sln.yml@main
  container:
    uses: y-function/workflows/.github/workflows/docker-push.yml@main
        
